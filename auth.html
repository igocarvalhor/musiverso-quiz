<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4da9ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Musiverso Login</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>
    <div class="stars"></div>

    <main class="app-shell auth-shell">
      <header class="hero">
        <img class="hero-logo" src="icon.svg" alt="Logo do Musiverso Quiz" />
        <p class="badge">Musiverso</p>
        <h1>Entrar no Quiz</h1>
        <p class="subtitle">Entre com seu nickname e continue sua aventura musical.</p>
      </header>

      <section class="panel auth-panel" id="authPanel">
        <h2>Login / Criar conta</h2>
        <p class="hint">Seu nickname e unico: use de 3 a 20 caracteres.</p>

        <div class="input-row">
          <input
            id="authNickname"
            name="authNickname"
            type="text"
            maxlength="20"
            placeholder="Nickname"
          />
          <input
            id="authPassword"
            name="authPassword"
            type="password"
            maxlength="72"
            placeholder="Senha (minimo 6 caracteres)"
          />
        </div>

        <div class="auth-actions">
          <button id="loginBtn" class="secondary-btn">Entrar</button>
          <button id="registerBtn" class="primary-btn">Criar conta</button>
        </div>

        <p id="authStatus" class="feedback"></p>
      </section>
    </main>

    <script src="pwa.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
